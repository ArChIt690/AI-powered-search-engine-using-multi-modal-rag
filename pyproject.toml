[project]
name = "ai-powered-search-engine-using-multi-modal-rag"
version = "0.1.0"
description = "AI-powered search engine using multimodal RAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=18.1.0",
    "defusedxml>=0.7.1",
    "elasticsearch>=8,<9",
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "langchain-elasticsearch>=1.0.0",
    "langchain-experimental>=0.4.2",
    "langchain-text-splitters>=1.1.2",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "redis>=8.1.0",
    "sentence-transformers>=6.1.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
search-engine = "search_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/search_engine"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
