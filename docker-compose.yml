# The whole project:  docker compose up -d --build   ->   http://localhost:8501 (on this machine only)
# Shared over Tailscale:  docker compose --profile tailscale up -d --build   ->   https://search.<tailnet>.ts.net
# Only the databases (to run the API and frontend with uv instead):  docker compose up -d elasticsearch redis
#
#   tailscale (:443 users, :8443 admins) -> frontend / admin -> api -> elasticsearch, redis, Groq / Gemini
#
# Every port below is bound to 127.0.0.1: reachable from this machine only, never from the network. People reach
# the pages only through Tailscale, which serves just the two pages, and nothing else.

# Fixed project name, so the volumes (indexes, caches, models) keep their names even if the folder is renamed
name: aipoweredsearchengineusingmultimodalrag

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: search-es
    environment:
      - discovery.type=single-node          # one node, no cluster
      - xpack.security.enabled=false        # no auth/TLS for local dev
      - ES_JAVA_OPTS=-Xms1g -Xmx1g          # cap the Java heap at 1 GB
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    mem_limit: 2g                           # heap + off-heap; keeps one container from taking Docker down
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 10s
      retries: 12

  redis:
    image: redis/redis-stack-server:7.4.0-v1  # Redis + vector search (for the prompt cache)
    container_name: search-redis
    environment:
      # Append-only file: every change is on disk within a second, so the index version, caches and sessions
      # survive a restart or a Docker crash (the default snapshots only every 5-60 minutes)
      - REDIS_ARGS=--appendonly yes --appendfsync everysec
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 6

  api:
    build: .
    image: search-engine-api
    container_name: search-api
    env_file: .env                          # GROQ_* / GEMINI_* keys; never copied into the image
    environment:
      # inside Docker the databases are reached by service name, not localhost
      - ES_URL=http://elasticsearch:9200
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data                    # uploaded files, FAISS cache, eval results: kept, and visible on disk
      - model_cache:/models                 # bge, CLIP, cross encoder, Whisper: downloaded once, kept
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 3g                           # models + PyTorch; a video ingest (Whisper) needs the headroom
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 900s                    # the first start downloads the models (about 1.5 GB; ~8 min measured)
      retries: 5

  frontend:
    build: ./frontend
    image: search-engine-frontend
    container_name: search-frontend
    environment:
      - API_URL=http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5

  admin:
    image: search-engine-frontend           # the same image as frontend, running the admin page
    container_name: search-admin
    command: ["streamlit", "run", "admin.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]
    environment:
      - API_URL=http://api:8000
      - SEARCH_ADMINS=${SEARCH_ADMINS:-}    # Tailscale logins allowed on the admin page, comma-separated (.env)
    ports:
      - "127.0.0.1:8502:8501"
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started          # frontend builds the shared image
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5

  # Joins your tailnet as the machine "search" and serves the two pages over HTTPS (tailscale/serve.json):
  # https://search.<tailnet>.ts.net for questions, :8443 for the admin page. Started only with --profile tailscale.
  tailscale:
    image: tailscale/tailscale:v1.102.4
    container_name: search-tailscale
    hostname: search
    profiles: ["tailscale"]
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}            # .env; a tagged auth key from the Tailscale admin console
      # Optional: with the access policy in tailscale/policy.example.hujson applied, set
      # TS_EXTRA_ARGS=--advertise-tags=tag:search-engine in .env (and use a tagged auth key)
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:-}
      - TS_STATE_DIR=/var/lib/tailscale       # its identity, kept across restarts
      - TS_USERSPACE=true                     # no kernel network device needed (works on Docker Desktop too)
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    depends_on:
      frontend:
        condition: service_healthy
      admin:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped

volumes:
  tailscale_state:
  es_data:
  redis_data:
  model_cache:
