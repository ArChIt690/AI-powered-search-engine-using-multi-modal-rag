services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: search-es
    environment:
      - discovery.type=single-node          # one node, no cluster
      - xpack.security.enabled=false        # no auth/TLS for local dev
      - ES_JAVA_OPTS=-Xms1g -Xmx1g          # cap memory at 1 GB
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 10s
      retries: 12

  redis:
    image: redis/redis-stack-server:7.4.0-v1  # Redis + vector search (for the prompt cache)
    container_name: search-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 6

volumes:
  es_data:
  redis_data:
